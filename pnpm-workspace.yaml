packages:
  - server
  - client

# pnpm blocks dependency build scripts by default (pnpm 11+ calls the
# allow-list allowBuilds). These legitimately need theirs: Prisma downloads
# query engines, esbuild installs its platform binary, argon2 compiles its
# native binding (node-gyp).
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  argon2: true

# pnpm 11+ refuses to install versions published less than 24h ago
# (supply-chain guard). vite 8.3.2 is newer than that window; opted out
# for this exact version only — the guard stays on for everything else.
minimumReleaseAgeExclude:
  - vite@8.3.2
